components:
  schemas:
    DateSpotSummaryData:
      type: object
      required:
        - id
        - city_name
        - latitude
        - longitude
        - prefecture_name
        - genre_name
        # - review_total_number  # レビュー機能は無効化中
        # - average_rate         # レビュー機能は無効化中
        - date_spot
      properties:
        id:
          type: integer
        city_name:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        prefecture_name:
          type: string
        genre_name:
          type: string
        # レビュー機能は無効化中（復活させる場合はコメントアウトを解除する）
        # review_total_number:
        #   type: integer
        # average_rate:
        #   type: number
        #   format: float
        source:
          type: string
          enum: [manual, hotpepper, jalan]
        maps_url:
          type: string
          nullable: true
        date_spot:
          $ref: "./date_spots.yaml#/components/schemas/DateSpotData"
