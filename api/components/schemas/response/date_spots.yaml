components:
  schemas:
    DateSpotData:
      type: object
      required:
      - id
      - name
      - image
      - created_at
      - updated_at
      # - average_rate  # レビュー機能は無効化中
      - genre_id
      properties:
        id:
          type: integer
        name:
          type: string
        image:
          $ref: "./image.yaml#/components/schemas/ImageData"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        # レビュー機能は無効化中（復活させる場合はコメントアウトを解除する）
        # average_rate:
        #   type: number
        #   format: float
        genre_id:
          type: integer
    DateSpotFormResponseData:
      type: object
      required:
        - date_spot_id
      properties:
        date_spot_id:
          type: integer