components:
  schemas:
    # email は本人向けのレスポンス（ログイン・新規登録）でのみ設定する。
    # 公開されるコースの投稿者情報などでは省略する。
    UserData:
      type: object
      required:
        - id
        - name
        - gender
        - image
        - admin
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        gender:
          $ref: "../gender.yaml#/components/schemas/Gender"
        image:
          $ref: "./image.yaml#/components/schemas/ImageData"
        admin:
          type: boolean
    # 他のユーザーからも参照されるため email は含めない。
    # 本人のメールアドレスはログイン・新規登録のレスポンスから取得する。
    UserResponseData:
      type: object
      required:
        - id
        - admin
        - gender
        - image
        - name
        - followerIds
        - followingIds
        - courses
        - date_spot_reviews
      properties:
        id:
          type: integer
        admin:
          type: boolean
        gender:
          $ref: "../gender.yaml#/components/schemas/Gender"
        image:
          $ref: "./image.yaml#/components/schemas/ImageData"
        name:
          type: string
        followerIds:
          type: array
          items:
            type: integer
        followingIds:
          type: array
          items:
            type: integer
        courses:
          type: array
          items:
            $ref: "./courses.yaml#/components/schemas/CourseResponseData"
        date_spot_reviews:
          type: array
          items:
            $ref: "./date_spot_review.yaml#/components/schemas/DateSpotReviewData"